services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: liberato
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: liberato
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberato -d liberato"]
      interval: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://liberato:localdev@db:5432/liberato
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
